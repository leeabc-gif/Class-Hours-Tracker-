name: Release

# 触发：推送 v* tag（如 v1.0.2）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, openssl
          tools: composer:false

      - name: Compute version
        id: v
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=$TAG"      >> $GITHUB_OUTPUT
          echo "version=$VER"  >> $GITHUB_OUTPUT
          echo "asset_base=keshi-$VER" >> $GITHUB_OUTPUT

      - name: Prepare upgrade.sql
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p release
          rm -f upgrade.sql
          # 优先精确匹配当前版本（兼容 "20260909_v107_..." 与 "20260909_107_..." 两种命名）
          MIG=""
          for cand in \
            "database/migrations/20260909_v${VER//./}_version_sync.sql" \
            "database/migrations/20260909_${VER//./}_version_sync.sql" ; do
            if [ -f "$cand" ]; then MIG="$cand"; break; fi
          done
          # 退路：取 migrations 目录中版本号最大的 *_version_sync.sql（按文件名排序）
          if [ -z "$MIG" ]; then
            MIG="$(ls -1 database/migrations/*_version_sync.sql 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -n "$MIG" ] && [ -f "$MIG" ]; then
            cp "$MIG" upgrade.sql
            echo "upgrade.sql <- $MIG"
          else
            echo "::warning::未找到 *_version_sync.sql，本次发布包不含 upgrade.sql"
          fi
          # 将当前版本迁移放在项目根，随后由 zip 一并打包

      - name: Build release zip
        env:
          ASSET_BASE: ${{ steps.v.outputs.asset_base }}
        run: |
          set -e
          mkdir -p release
          # 排除运行期产物、本地配置、安装锁、签名私钥、git 历史
          zip -r "release/${ASSET_BASE}.zip" . \
            -x "runtime/*" \
            -x "config/installed.php" \
            -x "config/database.php" \
            -x "public/install/*" \
            -x ".git/*" \
            -x "release/*" \
            -x ".github/*" \
            -x "_env/*" \
            -x ".codebuddy/*" \
            -x "tools/sign_manifest.php"
          ls -la release/
          rm -f upgrade.sql


      - name: Sign manifest
        id: sign
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.version }}
          ASSET_BASE: ${{ steps.v.outputs.asset_base }}
        run: |
          set -e
          if [ -z "$MANIFEST_PRIVATE_KEY" ]; then
            echo "::warning::MANIFEST_PRIVATE_KEY 未配置，将发布未签名的 manifest（仅供内测）"
          else
            echo "$MANIFEST_PRIVATE_KEY" > /tmp/manifest_priv.pem
            php tools/sign_manifest.php \
              --version="$VER" \
              --tag="$TAG" \
              --package="release/${ASSET_BASE}.zip" \
              --private-key=/tmp/manifest_priv.pem \
              --changelog-file=PROJECT_CHANGELOG.md \
              --out=release/manifest.json
            rm -f /tmp/manifest_priv.pem
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/manifest.json
            release/keshi-${{ steps.v.outputs.version }}.zip
