# ============================================================
# CNB 云原生构建 (CNB) 流水线配置
#
# 触发：git push 任何以 v 开头的 tag (v1.0.0, v1.0.1, v2.0.0-beta ...)
# 动作：
#   1) 用 PHP 构建 release/keshi-<VER>.zip
#   2) 用 tools/sign_manifest.php 签 release/manifest.json
#   3) 把 manifest.json + zip 上传到 CNB Release，公开仓库匿名可下载
#
# 下载链接(发布成功后)：
#   https://cnb.cool/bmayan/class-hours-tracker/-/releases/latest/download/manifest.json
#   https://cnb.cool/bmayan/class-hours-tracker/-/releases/latest/download/keshi-<TAG>.zip
#
# 私钥注入（CNB 用 imports 读取密钥仓库）：
#   - 仓库 bmayan/secrets  → 文件 envs.yml
#   - 内容：
#       MANIFEST_PRIVATE_KEY: |
#         -----BEGIN RSA PRIVATE KEY-----
#         ... PEM 文本（含头尾标记）...
#         -----END RSA PRIVATE KEY-----
#   - .cnb.yml 通过 imports 把 envs.yml 注入为 $MANIFEST_PRIVATE_KEY 环境变量
#   - 对应公钥在 config/update_trust.php（出厂信任）
#   - v1.0.1 旧私钥已遗失，v1.0.2+ 使用新密钥对（详见 config/update_trust.php 头注释）
#
# v1.0.2+ 注意：
#   - 默认更新源已切到 GitHub Releases（.github/workflows/release.yml）。
#   - 本配置作为 CNB 兼容通道保留，管理员可在「基础配置 → 更新源」切回 cnb。
# ============================================================

"v*":
  tag_push:
    - imports: https://cnb.cool/bmayan/secrets/-/blob/main/envs.yml
      stages:
        - name: setup-php
          image: php:8.1-cli-alpine
          script:
            - set -eu
            - apk add --no-cache git zip bash openssl
            - docker-php-ext-install -j$(nproc) zip openssl 2>/dev/null || true
            - php -v
            - php -m | grep -E "^(zip|openssl)$"

        - name: build-zip
          image: php:8.1-cli-alpine
          script:
            - set -eu
            - apk add --no-cache git zip bash
            - TAG="${CNB_BRANCH}"
            - VER="${TAG#v}"
            - ASSET_BASE="keshi-${VER}"
            - cd "$WORKSPACE"
            - |
              if [ -f database/migrations/20260909_v105_version_sync.sql ]; then
                cp database/migrations/20260909_v105_version_sync.sql upgrade.sql
              fi
            - |
              zip -r "release/${ASSET_BASE}.zip" . \
                -x "runtime/*" \
                -x "config/installed.php" \
                -x "config/database.php" \
                -x "public/install/*" \
                -x ".git/*" \
                -x "release/*" \
                -x ".github/*" \
                -x ".codebuddy/*" \
                -x "tools/sign_manifest.php" \
                -x "_env/*"
            - ls -la release/
            - rm -f upgrade.sql
            - echo "✓ built release/${ASSET_BASE}.zip"

        - name: sign-manifest
          image: php:8.1-cli-alpine
          script:
            - set -eu
            - apk add --no-cache git bash openssl
            - cd "$WORKSPACE"
            - TAG="${CNB_BRANCH}"
            - VER="${TAG#v}"
            - ASSET_BASE="keshi-${VER}"
            - |
              if [ -z "${MANIFEST_PRIVATE_KEY:-}" ]; then
                echo "::warning::MANIFEST_PRIVATE_KEY 未配置，将发布未签名的 manifest（仅供内测）"
              else
                printf '%s\n' "$MANIFEST_PRIVATE_KEY" > /tmp/manifest_priv.pem
                php tools/sign_manifest.php \
                  --version="$VER" \
                  --tag="$TAG" \
                  --package="release/${ASSET_BASE}.zip" \
                  --private-key=/tmp/manifest_priv.pem \
                  --changelog-file=PROJECT_CHANGELOG.md \
                  --out=release/manifest.json
                rm -f /tmp/manifest_priv.pem
              fi
            - ls -la release/

        - name: publish-release-assets
          image: alpine:3.20
          script:
            - set -eu
            - apk add --no-cache curl jq bash
            - TAG="${CNB_BRANCH}"
            - VER="${TAG#v}"
            - REPO="bmayan/class-hours-tracker"
            - BASE="https://api.cnb.cool"
            - ASSET_BASE="keshi-${VER}"

            - echo "→ publish release for tag $TAG (version $VER)"

            # 1) 在仓库下创建 release (空 release，先建壳)
            - |
              CREATE=$(curl -sS -X POST \
                "$BASE/$REPO/-/releases" \
                -H "Authorization: Bearer $CNB_PIPELINE_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"tag_name\":\"$TAG\",\"name\":\"keshi $VER\",\"body\":\"## keshi $VER\\n\\n自动发布。详见 https://cnb.cool/$REPO\"}")
              echo "create release response: $CREATE"

            # 2) 取 release_id
            - |
              LIST=$(curl -sS "$BASE/$REPO/-/releases" \
                -H "Authorization: Bearer $CNB_PIPELINE_TOKEN")
              RELEASE_ID=$(echo "$LIST" | jq -r --arg t "$TAG" \
                '.data[] | select(.tag_name==$t) | .id' | head -n1)
              echo "release_id=$RELEASE_ID"
              if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
                echo "!! failed to obtain release_id"; exit 1
              fi

            # 3) 上传每个资产文件
            - |
              upload_asset() {
                local FILE="$1"
                local NAME="$2"
                if [ ! -f "$FILE" ]; then echo "!! missing $FILE"; exit 1; fi

                local RESP=$(curl -sS -X POST \
                  "$BASE/$REPO/-/releases/$RELEASE_ID/asset-upload-url" \
                  -H "Authorization: Bearer $CNB_PIPELINE_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data "{\"name\":\"$NAME\"}")
                local UPLOAD_URL=$(echo "$RESP" | jq -r '.data.upload_url // .data.url // empty')
                if [ -z "$UPLOAD_URL" ]; then echo "!! no upload_url: $RESP"; exit 1; fi

                local TOKEN=$(echo "$RESP" | jq -r '.data.token // empty')
                local UPLOAD_KEY=$(echo "$RESP" | jq -r '.data.key // empty')

                curl -sS -X PUT -T "$FILE" \
                  -H "Content-Type: application/octet-stream" \
                  "$UPLOAD_URL" >/dev/null
                if [ -n "$TOKEN" ] && [ -n "$UPLOAD_KEY" ]; then
                  curl -sS -X POST \
                    "$BASE/$REPO/-/releases/$RELEASE_ID/asset-upload-confirmation/$TOKEN/$UPLOAD_KEY" \
                    -H "Authorization: Bearer $CNB_PIPELINE_TOKEN" >/dev/null
                fi
                echo "  ↑ uploaded $NAME"
              }

              upload_asset "release/manifest.json" "manifest.json"
              upload_asset "release/${ASSET_BASE}.zip" "${ASSET_BASE}.zip"

            - echo "✓ done. latest manifest URL:"
            - echo "  https://cnb.cool/$REPO/-/releases/latest/download/manifest.json"

# 主分支 push 时跑一次"包是否齐全"检查
main:
  push:
    - stages:
        - name: sanity
          image: alpine:3.20
          script:
            # 注：release/ 目录由 tag push 的发布任务生成（不在 main 分支构建）
            # 这里只校验关键源文件齐全
            - test -f application/api/controller/Admin.php
            - test -f application/common/service/UpdateService.php
            - test -f application/common/service/ResetDemo.php
            - test -f database/seed.sql
            - test -f config/update_trust.php
            - test -f .cnb.yml
            - test -f .github/workflows/release.yml
            - echo "✓ core source files present"
