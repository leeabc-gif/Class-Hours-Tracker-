# 宝塔 Nginx 伪静态配置
# 使用方法：复制到宝塔站点 -> 设置 -> 伪静态，并按实际站点目录确认 root。
location / {
    try_files $uri $uri/ /index.php?s=$uri&$args;
}

# PHP 入口由宝塔面板自动生成；如需手工配置，请将 fastcgi_pass 替换为当前 PHP 版本的 socket。
# location ~ \.php(.*)$ {
#     fastcgi_pass unix:/tmp/php-cgi-74.sock;
#     fastcgi_index index.php;
#     include fastcgi.conf;
#     fastcgi_param PATH_INFO $1;
# }

# 禁止访问敏感文件；站点根目录必须指向 keshi/public。
location ~ ^/(?:\.env|config|application|database|thinkphp|vendor|runtime)(?:/|$) {
    deny all;
    return 404;
}

location ~ /\. { deny all; return 404; }
